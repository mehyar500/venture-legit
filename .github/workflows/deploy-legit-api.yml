# Deploy legit-api Worker to Cloudflare. Backend workstream only — never touches pwa/.
# `wrangler deploy` (Workers) is safe here: all bindings live in wrangler.toml,
# so every deploy carries them. NEVER `wrangler pages deploy` from anywhere.

name: deploy-legit-api

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "seed.sql"
      - "CONTRACT.md"
      - ".github/workflows/deploy-legit-api.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install URL signing secret
        if: ${{ secrets.URL_SIGNING_KEY != '' }}
        run: printf '%s' "${{ secrets.URL_SIGNING_KEY }}" | npx wrangler secret put URL_SIGNING_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
